<text x="65" y="1412" font-size="36" font-weight="600" fill="#222" text-anchor="start">61 PostgreSQL tables in 11 functional domains (Drizzle ORM schema · 29 enums · 26 additive migrations). Highlighted rows: core transactional entities.</text>
<text x="65" y="1459.52" font-size="36" font-weight="600" fill="#222" text-anchor="start">Arrows: foreign-key dependencies between domains (e.g. every *_orders table references transactions; waqf_programs references nadzir_profiles).</text>
<text x="65" y="1507.04" font-size="36" font-weight="600" fill="#222" text-anchor="start">Most domain tables also reference users (Identity &amp; Access); those edges are omitted for clarity. Column definitions are omitted.</text>
